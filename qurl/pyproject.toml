[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qurl"
version = "0.3.0"
description = "QuRL (arXiv:2602.13953) in plain PyTorch: INT8 W8A8 quantized rollout, TIS + ACR policy loss, UAQ"
readme = "README.md"
requires-python = ">=3.10"
# Tested with torch 2.11 and transformers 5.9 (Python 3.12).
dependencies = ["torch>=2.6"]

[project.optional-dependencies]
train = ["transformers>=4.51", "safetensors"]
test = ["pytest>=8", "numpy", "transformers>=4.51", "tokenizers", "safetensors"]

[project.scripts]
qurl-train = "qurl.train:main"
qurl-uaq-checkpoint = "qurl.uaq:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "gpu: needs CUDA (skipped without it)",
    "originals: compares with the experiment code this package was refactored from (skipped if it is absent)",
]
